<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chuyển đổi nhiệt độ</h2>
    <label for="">Nhập nhiệt độ (°C)</label>
    <input type='number' id='nhietdo'>
    <br><br>
    <button onclick="chuyendoi()">Chuyển đổi</button>
    <p id="ketqua"></p>

    <script>
        function chuyendoi() {
            let nhietdo = document.getElementById('nhietdo').value;
            let fahrenheit = (nhietdo * 9/5) + 32;
            document.getElementById('ketqua').innerHTML = nhietdo + "°C = " + fahrenheit + "°F";
        }
    </script>
</body>
</html>
