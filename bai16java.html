<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 16: findPairsWithSum</title>
</head>
<body>
    <h2>Bài 16: Tìm các cặp số có tổng bằng sum</h2>
    <input type="text" id="arr16" value="1, 2, 3, 4, 5">
    <input type="text" id="sum16" value="5">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function findPairsWithSum(arr, targetSum) {
            let pairs = [];
            let seen = [];
            for (let i = 0; i < arr.length; i++) {
                let num = arr[i];
                let complement = targetSum - num;
                if (seen.includes(complement)) {
                    pairs.push([complement, num]);
                }
                seen.push(num);
            }
            return pairs;
        }

        function run() {
            let arr = document.getElementById('arr16').value.split(',').map(Number);
            let sum = Number(document.getElementById('sum16').value);
            let result = findPairsWithSum(arr, sum);
            let strResult = result.map(p => "[" + p.join(", ") + "]").join(", ");
            document.getElementById('res').innerText = "Kết quả: [" + strResult + "]";
        }
    </script>
</body>
</html>
