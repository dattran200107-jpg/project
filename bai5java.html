<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 5: sumArray</title>
</head>
<body>
    <h2>Bài 5: Tính tổng mảng</h2>
    <input type="text" id="arr5" value="1, 2, 3, 4, 5">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function sumArray(arr) {
            let total = 0;
            for (let i = 0; i < arr.length; i++) total += arr[i];
            return total;
        }

        function run() {
            let arr = document.getElementById('arr5').value.split(',').map(Number);
            document.getElementById('res').innerText = "Kết quả: " + sumArray(arr);
        }
    </script>
</body>
</html>
