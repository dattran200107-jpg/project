<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Máy tính đơn giản</h2>
    <label for="">Nhập số thứ nhất</label>
    <input type='number' id='so1'>
    <br><br>
    <label for="">Nhập số thứ hai</label>
    <input type='number' id='so2'>
    <br><br>
    <button onclick="tinh()">Tính</button>
    <p id="ketqua"></p>

    <script>
        function tinh() {
            let so1 = parseFloat(document.getElementById('so1').value);
            let so2 = parseFloat(document.getElementById('so2').value);
            let tong = so1 + so2;
            let hieu = so1 - so2;
            let tich = so1 * so2;
            let thuong = so1 / so2;
            document.getElementById('ketqua').innerHTML = 'Tổng: ' + tong + '<br>Hiệu: ' + hieu + '<br>Tích: ' + tich + '<br>Thương: ' + thuong;
        }
    </script>
</body>
</html>
