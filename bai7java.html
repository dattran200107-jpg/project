<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 7: isAscending</title>
</head>
<body>
    <h2>Bài 7: Kiểm tra dãy tăng dần</h2>
    <input type="text" id="arr7" value="1, 2, 3, 5">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function isAscending(arr) {
            if (!arr || arr.length <= 1) return false;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] >= arr[i + 1]) return false;
            }
            return true;
        }

        function run() {
            let arr = document.getElementById('arr7').value.split(',').map(Number);
            document.getElementById('res').innerText = "Kết quả: " + isAscending(arr);
        }
    </script>
</body>
</html>
