<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Kiểm tra năm nhuận</h2>
    <label for="">Nhập năm</label>
    <input type='number' id='nam'>
    <br><br>
    <button onclick="kiemtra()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function kiemtra() {
            let nam = document.getElementById('nam').value;
            if ((nam % 4 === 0 && nam % 100 !== 0) || (nam % 400 === 0)) {
                document.getElementById('ketqua').innerHTML = nam + " là năm nhuận";
            } else {
                document.getElementById('ketqua').innerHTML = nam + " không phải là năm nhuận";
            }
        }
    </script>
</body>
</html>
