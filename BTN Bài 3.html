<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch học</title>
    <style>
        table {
            width: 90%;
            border-collapse: collapse;
            margin: 30px auto;
            font-size: 28px;
            text-align: center;
        }

        th, td {
            border: 1px solid #666;
            padding: 2px 8px;
        }
    </style>
</head>
<body>
    <center>
        <h1>LỊCH HỌC</h1>
        <table>
            <thead>
                <tr>
                    <th>Thứ</th>
                    <th>Hai</th>
                    <th>Ba</th>
                    <th>Tư</th>
                    <th>Năm</th>
                    <th>Sáu</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">Sáng</td>
                    <td>LTHĐT</td>
                    <td rowspan="2">CTDL-GT</td>
                    <td rowspan="2">PTHT</td>
                    <td>CSDL</td>
                    <td rowspan="2">CSDL</td>
                </tr>
                <tr>
                    <td>LTW</td>
                    <td>LTW</td>
                </tr>
                <tr>
                    <td rowspan="2">Chiều</td>
                    <td>TDTT</td>
                    <td>QTM</td>
                    <td>TRR</td>
                    <td colspan="2">TDTT</td>
                </tr>
                <tr>
                    <td colspan="2">AV</td>
                    <td>CSDL</td>
                    <td colspan="2">CNTT CB</td>
                </tr>
            </tbody>
        </table>
    </center>
</body>
</html>
