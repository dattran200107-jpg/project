<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 6: calculateAverage</title>
</head>
<body>
    <h2>Bài 6: Tính trung bình cộng</h2>
    <input type="text" id="arr6" value="10, 20, 30, 40, 50">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function sumArray(arr) {
            let total = 0;
            for (let i = 0; i < arr.length; i++) total += arr[i];
            return total;
        }

        function calculateAverage(arr) {
            if (!arr || arr.length === 0) return 0;
            return sumArray(arr) / arr.length;
        }

        function run() {
            let arr = document.getElementById('arr6').value.split(',').map(Number);
            document.getElementById('res').innerText = "Kết quả: " + calculateAverage(arr);
        }
    </script>
</body>
</html>
