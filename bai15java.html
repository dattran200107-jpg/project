<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 15: removeDuplicates</title>
</head>
<body>
    <h2>Bài 15: Loại bỏ phần tử trùng lặp</h2>
    <input type="text" id="arr15" value="1, 2, 2, 3, 4, 4, 5">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function removeDuplicates(arr) {
            let seen = [];
            for (let i = 0; i < arr.length; i++) {
                if (!seen.includes(arr[i])) seen.push(arr[i]);
            }
            return seen;
        }

        function run() {
            let arr = document.getElementById('arr15').value.split(',').map(Number);
            document.getElementById('res').innerText = "Kết quả: [" + removeDuplicates(arr).join(", ") + "]";
        }
    </script>
</body>
</html>
