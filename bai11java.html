<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 11: filterEvensAndSum</title>
</head>
<body>
    <h2>Bài 11: Lọc số chẵn và tính tổng</h2>
    <input type="text" id="arr11" value="1, 2, 3, 4, 5, 6">
    <button onclick="run()">Chạy</button>
    <p id="res"></p>

    <script>
        function filterEvensAndSum(arr) {
            let total = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 === 0) total += arr[i];
            }
            return total;
        }

        function run() {
            let arr = document.getElementById('arr11').value.split(',').map(Number);
            document.getElementById('res').innerText = "Kết quả: " + filterEvensAndSum(arr);
        }
    </script>
</body>
</html>
