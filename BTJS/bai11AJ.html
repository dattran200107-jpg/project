
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 11: Lọc số chẵn và tính tổng
        function filterEvensAndSum(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 === 0) {
                    sum += arr[i];
                }
            }

            return sum;
        }

        document.write("<h1>Viết hàm filterEvensAndSum</h1>");
        document.write("<p>Kết quả tổng các số chẵn là: " + filterEvensAndSum([1, 2, 3, 4, 5, 6]) + "</p>");
    </script>

</body>
</html>
