
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 1: Tìm số lớn nhất
        function findMax(arr) {
            if (arr.length === 0) return null;

            let max = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i];
                }
            }

            return max;
        }

        document.write("<h1>Viết hàm findMax</h1>");
        document.write("<p>Kết quả số lớn nhất là: " + findMax([1, 3, 5, 7, 9]) + "</p>");
    </script>

</body>
</html>
