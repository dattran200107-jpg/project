
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 16: Tìm các cặp số có tổng bằng sum
        function findPairsWithSum(arr, sum) {
            let result = [];

            for (let i = 0; i < arr.length; i++) {
                for (let j = i + 1; j < arr.length; j++) {
                    if (arr[i] + arr[j] === sum) {
                        result.push([arr[i], arr[j]]);
                    }
                }
            }

            return result;
        }

        document.write("<h1>Viết hàm findPairsWithSum</h1>");
        document.write("<p>Kết quả các cặp số là: " + JSON.stringify(findPairsWithSum([1, 2, 3, 4, 5], 5)) + "</p>");
    </script>

</body>
</html>
