
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 12: Tìm chuỗi dài nhất
        function findLongestWord(arr) {
            if (arr.length === 0) return "";

            let longest = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i].length > longest.length) {
                    longest = arr[i];
                }
            }

            return longest;
        }

        document.write("<h1>Viết hàm findLongestWord</h1>");
        document.write("<p>Kết quả chuỗi dài nhất là: " + findLongestWord(["apple", "banana", "cherry", "date"]) + "</p>");
    </script>

</body>
</html>
