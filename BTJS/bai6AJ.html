
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 6: Tính trung bình cộng
        function calculateAverage(arr) {
            if (arr.length === 0) return 0;

            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
            }

            return sum / arr.length;
        }

        document.write("<h1>Viết hàm calculateAverage</h1>");
        document.write("<p>Kết quả trung bình cộng là: " + calculateAverage([10, 20, 30, 40, 50]) + "</p>");
    </script>

</body>
</html>
