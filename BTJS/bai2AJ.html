
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 2: Tính tổng các số lẻ
        function sumOddNumbers(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 !== 0) {
                    sum += arr[i];
                }
            }

            return sum;
        }

        document.write("<h1>Viết hàm sumOddNumbers</h1>");
        document.write("<p>Kết quả tổng các số lẻ là: " + sumOddNumbers([1, 2, 3, 4, 5]) + "</p>");
    </script>

</body>
</html>
