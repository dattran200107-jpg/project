
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 3: Tìm số nhỏ nhất
        function findMin(arr) {
            if (arr.length === 0) return null;

            let min = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }
            }

            return min;
        }

        document.write("<h1>Viết hàm findMin</h1>");
        document.write("<p>Kết quả số nhỏ nhất là: " + findMin([5, 2, 8, 1, 4]) + "</p>");
    </script>

</body>
</html>
