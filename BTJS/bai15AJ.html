
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 15: Xóa phần tử trùng lặp
        function removeDuplicates(arr) {
            let result = [];

            for (let i = 0; i < arr.length; i++) {
                let found = false;

                for (let j = 0; j < result.length; j++) {
                    if (arr[i] === result[j]) {
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    result.push(arr[i]);
                }
            }

            return result;
        }

        document.write("<h1>Viết hàm removeDuplicates</h1>");
        document.write("<p>Kết quả mảng sau khi xóa trùng lặp là: " + JSON.stringify(removeDuplicates([1, 2, 2, 3, 4, 4, 5])) + "</p>");
    </script>

</body>
</html>
