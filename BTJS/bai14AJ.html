
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>

    <script>
        // Bài tập 14: Tìm số bị thiếu
        function findMissingNumber(arr, n) {
            let total = n * (n + 1) / 2;
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
            }

            return total - sum;
        }

        document.write("<h1>Viết hàm findMissingNumber</h1>");
        document.write("<p>Kết quả số bị thiếu là: " + findMissingNumber([1, 2, 4, 5, 6], 6) + "</p>");
    </script>

</body>
</html>
